name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Rust core is cross-compiled by the Gradle build, so the toolchain
      # and the NDK have to be present before Gradle runs.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install NDK and SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDKROOT"
            ls -la "$SDKROOT"
            exit 1
          fi
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDKROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "Using NDK at $ANDROID_NDK_HOME"

      - name: Run Rust tests
        working-directory: rust
        run: cargo test -p annas_core --lib

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiet-archive-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
